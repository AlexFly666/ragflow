# RAGFlow 服务配置
ragflow:
  # 服务监听地址
  host: 0.0.0.0
  # HTTP 服务端口
  http_port: 9380

# MySQL 数据库配置
mysql:
  # 数据库名称
  name: 'rag_flow'
  # 数据库用户名
  user: 'root'
  # 数据库密码
  password: 'infini_rag_flow'
  # 数据库主机地址
  host: 'localhost'
  # 数据库端口
  port: 5455
  # 最大连接数
  max_connections: 100
  # 连接超时时间（秒）
  stale_timeout: 30

# MinIO 对象存储配置
minio:
  # MinIO 用户名
  user: 'rag_flow'
  # MinIO 密码
  password: 'infini_rag_flow'
  # MinIO 服务地址
  host: 'localhost:9000'

# Elasticsearch 配置
es:
  # ES 服务地址
  hosts: 'http://localhost:1200'
  # ES 用户名
  username: 'elastic'
  # ES 密码
  password: 'infini_rag_flow'

# Infinity 向量数据库配置
infinity:
  # Infinity 服务地址
  uri: 'localhost:23817'
  # 默认数据库名称
  db_name: 'default_db'

# Redis 缓存配置
redis:
  # Redis 数据库索引
  db: 1
  # Redis 密码
  password: 'infini_rag_flow'
  # Redis 服务地址
  host: 'localhost:6379'

